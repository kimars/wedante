version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedante
      POSTGRES_PASSWORD: wedante
      POSTGRES_DB: wedante
    ports:
      - "5432:5432"
    volumes:
      - wedante_pgdata:/var/lib/postgresql/data

volumes:
  wedante_pgdata:
