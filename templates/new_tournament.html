{% extends "base.html" %}
{% block content %}
<span class="eyebrow">New tournament</span>
<h1>새 대회 만들기</h1>
<form class="panel" method="post">
  <div class="field"><label>대회명</label><input name="title" required></div>
  <div class="field"><label>장소</label><input name="location"></div>
  <div class="field"><label>날짜</label><input name="event_date" type="date" value="{{ prefill_date }}"></div>
  <div class="field">
    <label>종목</label>
    <select name="format" required>
      <option value="singles" selected>단식 (Singles) - 선수 1명 = 1팀</option>
      <option value="doubles">복식 (Doubles) - 선수 2명 = 1팀</option>
    </select>
  </div>
  <div class="field">
    <label>본선 대진표 크기</label>
    <select name="main_bracket_size">
      <option value="">자동 (진출자 수에 맞게 계산)</option>
      <option value="16">16강 대진표 (진출 최대 16명/팀)</option>
      <option value="32">32강 대진표 (진출 최대 32명/팀)</option>
      <option value="64">64강 대진표 (진출 최대 64명/팀)</option>
    </select>
    <p style="font-size:12px;color:var(--ink-faint);margin:4px 0 0;">
      본선 트리 크기를 미리 정해두면 부전승(BYE) 슬롯이 자동으로 남아 유연한 대진 운영이 가능합니다.
    </p>
  </div>
  <div class="field">
    <label>예선 코트 배치 방식</label>
    <select name="groups_per_court">
      <option value="2" selected>1코트에 2개 조 (참가자 많을 때) - 6경기, 30분 간격 교차 진행</option>
      <option value="1">1코트에 1개 조 (참가자 적을 때) - 조당 3경기 연속</option>
    </select>
    <p style="font-size:12px;color:var(--ink-faint);margin:4px 0 0;">
      · 2조 프레임: 코트당 6경기(A1→B1→A2→B2→A3→B3), 조 교차 진행<br>
      · 1조 프레임: 코트당 3경기, 조가 코트를 단독 사용
    </p>
  </div>
  <div class="card-row" style="gap:12px;">
    <div class="field" style="flex:1;"><label>첫 경기 시작 시각</label><input name="start_time" placeholder="09:00" value="09:00"></div>
    <div class="field" style="flex:1;"><label>경기 간격 (분)</label><input name="match_interval_min" type="number" value="30" min="10" max="120"></div>
  </div>
  <div class="field">
    <label>예선 조 인원 (또는 조당 팀 수)</label>
    <input name="group_size" type="number" value="3" min="2" max="8">
    <p style="font-size:12px;color:var(--ink-faint);margin:4px 0 0;">기본 3명(또는 3팀). 1코트에 2조씩 배정되어 코트당 총 6경기가 30분 간격으로 자동 편성됩니다.</p>
  </div>
  <div class="field"><label>참가비 (원)</label><input name="entry_fee" type="number" value="0"></div>
  <div class="field"><label>주차등록 링크 (선택, 외부 주소)</label><input name="parking_url" placeholder="https://..."></div>
  <div class="card-row">
    <div class="field" style="flex:1;"><label>입금 은행</label><input name="deposit_bank" placeholder="국민은행"></div>
    <div class="field" style="flex:1;"><label>계좌번호</label><input name="deposit_account" placeholder="123-456-789"></div>
    <div class="field" style="flex:1;"><label>예금주</label><input name="deposit_holder" placeholder="위단테"></div>
  </div>
  <button type="submit">대회 생성</button>
</form>
{% endblock %}
